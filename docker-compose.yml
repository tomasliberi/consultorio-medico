services:
  postgres:
    image: postgres:16
    container_name: consultorio_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-consultorio}
      POSTGRES_USER: ${DB_USERNAME:-consultorio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe definirse fuera de Git}
    ports:
      - "5433:5432"
    volumes:
      - consultorio_postgres_data:/var/lib/postgresql/data

volumes:
  consultorio_postgres_data:
