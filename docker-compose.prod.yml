services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME es obligatoria}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME es obligatoria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
    volumes:
      - consultorio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}?options=-c%20TimeZone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN es obligatorio}
      INITIAL_USER_ENABLED: ${INITIAL_USER_ENABLED:-false}
      INITIAL_USER_USERNAME: ${INITIAL_USER_USERNAME:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    depends_on: [backend]
    networks: [internal]

networks:
  internal:

volumes:
  consultorio_postgres_data:
