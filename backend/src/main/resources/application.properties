spring.application.name=consultorio-backend
debug=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/consultorio?options=-c%20TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:consultorio_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.forward-headers-strategy=framework

server.servlet.context-path=/api

app.initial-user.enabled=${INITIAL_USER_ENABLED:false}
app.initial-user.username=${INITIAL_USER_USERNAME:}
app.initial-user.password=${INITIAL_USER_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
