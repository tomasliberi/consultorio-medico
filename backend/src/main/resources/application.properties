spring.application.name=consultorio-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/consultorio?options=-c%20TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:consultorio_user}
spring.datasource.password=${DB_PASSWORD:consultorio_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.context-path=/api

app.initial-user.username=${INITIAL_USER_USERNAME:admin}
app.initial-user.password=${INITIAL_USER_PASSWORD:admin123}
app.production=${APP_PRODUCTION:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
